{% load static %}

<nav class="pagination-container" aria-label="Пагінація">
    <p class="pagination-info">
        Сторінка {{ page_obj.number }} з {{ paginator.num_pages }}
    </p>

    <div class="pagination-buttons">
        <a 
        class="
        button 
        pagination-button 
        {% if not page_obj.has_previous %}
            is-disabled
        {% endif %}"
        id="firstPageButton"
        {% if page_obj.has_previous %}
        href="?page=1"
        {% endif %}
        >
            <img src="{% static 'english/img/action_icons/double-arrow-left.svg' %}" alt="double-arrow-left">
        </a>

        <a 
        class="
            button 
            pagination-button 
            {% if not page_obj.has_previous %}
                is-disabled
            {% endif %}
        "
        id="previousPageButton"
        {% if page_obj.has_previous %}
            href="?page={{ page_obj.previous_page_number }}"
        {% endif %}
        >
            <img src="{% static 'english/img/action_icons/chevron-left.svg' %}" alt="chevron-left">
        </a>

        <a 
        class="
            button 
            pagination-button 
            {% if not page_obj.has_next %}
                is-disabled
            {% endif %}
        "
        id="nextPageButton"
        {% if page_obj.has_next %}
            href="?page={{ page_obj.next_page_number }}"
        {% endif %}>
            <img src="{% static 'english/img/action_icons/chevron-right.svg' %}" alt="chevron-right">
        </a>

        <a 
        class="
            button 
            pagination-button 
            {% if not page_obj.has_next %}
                is-disabled
            {% endif %}
        "
        id="lastPageButton"
        {% if page_obj.has_next %}
            href="?page={{ paginator.num_pages }}"
        {% endif %}>
            <img src="{% static 'english/img/action_icons/double-arrow-right.svg' %}" alt="double-arrow-right">
        </a>
    </div>
</nav>
