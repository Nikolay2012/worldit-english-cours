{% load static %}

<template id="questionStepTemplate">
    <div class="question-step">
        <div class="question-step-prompt">
            <span class="question-step-word"></span>
            <img class="question-step-image" src="" alt="question-step-image">
        </div>

        <div class="question-step-options"></div>
    </div>
</template>

<template id="questionOptionTemplate">
    <button type="button" class="question-step-option"></button>
</template>
