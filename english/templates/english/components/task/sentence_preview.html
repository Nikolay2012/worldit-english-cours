{% load static %}

<div class="task-run" id="taskRun">
    <div class="task-run-step" id="taskRunStep">
        <div class="question-step">
            <div class="question-step-prompt">
                <p class="sentence-translation">Він не знаходить.</p>

                <div class="sentence-answer-row">
                    <div class="sentence-build" id="sentenceBuild">
                        <div class="sentence-build-words" id="sentenceBuildWords"></div>
                    </div>

                    <button type="button" class="sentence-check-button" id="sentenceCheckButton" disabled>
                        <img src="{% static 'english/img/action_icons/check.svg' %}" alt="check">
                    </button>
                </div>
            </div>
    
            <div class="line-spacer"></div>
    
            <div class="sentence-tokens">
                <div class="sentence-token" draggable="true" data-id="1" data-token="He">
                    <img 
                        class="sentence-token-grip" 
                        src="{% static 'english/img/action_icons/drag-handle-dots-2.svg' %}" 
                        alt="drag-handle-dots-2"
                        draggable="false"
                    >
                    <span class="sentence-token-text">He</span>
                </div>
                <div class="sentence-token" draggable="true" data-id="2" data-token="doesn`t">
                    <img 
                        class="sentence-token-grip" 
                        src="{% static 'english/img/action_icons/drag-handle-dots-2.svg' %}" 
                        alt="drag-handle-dots-2"
                        draggable="false"
                    >
                    <span class="sentence-token-text">doesn`t</span>
                </div>
                <div class="sentence-token" draggable="true" data-id="3" data-token="the">
                    <img 
                        class="sentence-token-grip" 
                        src="{% static 'english/img/action_icons/drag-handle-dots-2.svg' %}" 
                        alt="drag-handle-dots-2"
                        draggable="false"
                    >
                    <span class="sentence-token-text">the</span>
                </div>

                <div class="sentence-token" draggable="true" data-id="4" data-token="He">
                    <img 
                        class="sentence-token-grip" 
                        src="{% static 'english/img/action_icons/drag-handle-dots-2.svg' %}" 
                        alt="drag-handle-dots-2"
                        draggable="false"
                    >
                    <span class="sentence-token-text">He</span>
                </div>
                <div class="sentence-token" draggable="true" data-id="5" data-token="doesn`t">
                    <img 
                        class="sentence-token-grip" 
                        src="{% static 'english/img/action_icons/drag-handle-dots-2.svg' %}" 
                        alt="drag-handle-dots-2"
                        draggable="false"
                    >
                    <span class="sentence-token-text">doesn`t</span>
                </div>
                <div class="sentence-token" draggable="true" data-id="6" data-token="the">
                    <img 
                        class="sentence-token-grip" 
                        src="{% static 'english/img/action_icons/drag-handle-dots-2.svg' %}" 
                        alt="drag-handle-dots-2"
                        draggable="false"
                    >
                    <span class="sentence-token-text">the</span>
                </div>

                
            </div>
        </div>
    </div>

    <div class="task-run-progress">
        <p class="task-run-progress-title">Ваш прогрес</p>

        <div class="task-run-progress-track">
            <div class="task-run-progress-bar" id="taskRunProgressBar"></div>
        </div>

        <div class="task-run-progress-labels">
            <span id="taskRunProgressValue">0%</span>
            <span>100%</span>
        </div>
    </div>
</div>

<template id="sentenceStepTemplate">
    <div class="question-step">
        <div class="question-step-prompt">
            <p class="sentence-translation"></p>

            <div class="sentence-answer-row">
                <div class="sentence-build">
                    <div class="sentence-build-words"></div>
                </div>

                <button type="button" class="sentence-check-button" disabled>
                    <img src="{% static 'english/img/action_icons/check.svg' %}" alt="check">
                </button>
            </div>
        </div>

        <div class="line-spacer"></div>

        <div class="sentence-tokens"></div>
    </div>
</template>

<template id="sentencePlacedTokenTemplate">
    <div class="sentence-token" draggable="true">
        <img 
            class="sentence-token-grip" 
            src="{% static 'english/img/action_icons/drag-handle-dots-2.svg' %}" 
            alt="drag-handle-dots-2"
            draggable="false"
        >
        <span class="sentence-token-text"></span>
        <button type="button" class="sentence-token-remove">
            <img src="{% static 'english/img/action_icons/trash-2.svg' %}" alt="trash-2" draggable="false">
        </button>
    </div>
</template>

<script src="{% static 'english/js/task/sentence_builder.js' %}"></script>
