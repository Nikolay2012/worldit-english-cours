{% load static %}

<div class="words-panel-cover" id="wordsPanelCover"></div>

<div class="words-panel" id="wordsPanel">
    <div class="words-panel-header">
        <h3 class="words-panel-title" id="wordsPanelTitle">Список слів</h3>

        <button type="button" class="words-panel-close" id="closeWordsPanelButton">
            <img src="{% static 'english/img/action_icons/close.svg' %}" alt="">
        </button>
    </div>

    <div class="words-panel-body" id="wordsPanelBody">

        <section class="words-panel-category">
            <h4 class="words-panel-category-title">Займенники</h4>

            <ul class="words-panel-list">
                <li class="words-panel-row">
                    <span class="words-panel-word">I</span>
                    <span class="words-panel-progress">
                        <span class="words-panel-dot is-filled"></span>
                        <span class="words-panel-dot is-filled"></span>
                        <span class="words-panel-dot is-filled"></span>
                        <span class="words-panel-dot is-filled"></span>
                        <span class="words-panel-dot"></span>
                        <span class="words-panel-dot"></span>
                    </span>
                    <span class="words-panel-translation">Я</span>
                </li>

                <li class="words-panel-row">
                    <span class="words-panel-word">You</span>
                    <span class="words-panel-progress">
                        <span class="words-panel-dot is-filled"></span>
                        <span class="words-panel-dot is-filled"></span>
                        <span class="words-panel-dot is-filled"></span>
                        <span class="words-panel-dot"></span>
                        <span class="words-panel-dot"></span>
                        <span class="words-panel-dot"></span>
                    </span>
                    <span class="words-panel-translation">Ти, Ви</span>
                </li>
            </ul>
        </section>

        <section class="words-panel-category">
            <h4 class="words-panel-category-title">Дієслова</h4>

            <ul class="words-panel-list">
                <li class="words-panel-row">
                    <span class="words-panel-word">Ask</span>
                    <span class="words-panel-progress">
                        <span class="words-panel-dot is-filled"></span>
                        <span class="words-panel-dot is-filled"></span>
                        <span class="words-panel-dot"></span>
                        <span class="words-panel-dot"></span>
                        <span class="words-panel-dot"></span>
                        <span class="words-panel-dot"></span>
                    </span>
                    <span class="words-panel-translation">Запитати</span>
                </li>
            </ul>
        </section>

    </div>
</div>
