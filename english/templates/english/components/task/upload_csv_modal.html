{% load static %}

<div class="modal" id="uploadCsvModal"
    data-import-url="{% url 'english:api:api_import_task_data' task.id %}"
    data-delete-url="{% url 'english:api:api_delete_task_steps' task.id %}"
    data-words-url="{% url 'english:api:api_create_word' task.id %}"
    data-placeholder-url="{% static 'english/img/questions_placeholder/questions_placeholder.png' %}">

    <div class="row">
        <h3 id="uploadCsvTitle">Завантаження списку слів</h3>
        <img src="{% static 'english/img/action_icons/close.svg' %}" class="closeModal" alt="close">
    </div>

    <div class="info-block">

        <div class="upload-csv-select">
            <p class="upload-csv-description">
                Завантажте документ зі списком слів для цього уроку.
            </p>

            <button type="button" class="upload-csv-dropzone" id="uploadCsvDropzone">
                <span class="upload-csv-dropzone-title">
                    Натисніть, щоб <strong>обрати файл</strong>
                </span>
                <span class="upload-csv-dropzone-hint" id="uploadCsvFileName">
                    Підтримується: .csv
                </span>
            </button>

            <input type="file" id="uploadCsvInput" accept=".csv,text/csv" hidden>
        </div>

        <div class="upload-csv-loading">
            <p class="upload-csv-description">Триває завантаження документа...</p>

            <div class="upload-csv-progress" role="progressbar">
                <div class="upload-csv-progress-bar"></div>
            </div>
        </div>

        <div class="upload-csv-list" id="uploadCsvList"></div>

        <template id="wordsCategoryTemplate">
            <section class="words-category">
                <div class="words-category-header">
                    <h4 class="words-category-title"></h4>
                    <button type="button"
                            class="button collapse-button">
                        <img src="{% static 'english/img/action_icons/chevron-up.svg' %}" alt="chevron-up">
                    </button>
                </div>
                <div class="words-category-body">
                    <div class="words-category-body-inner">
                        <ul class="words-list"></ul>

                        <button type="button" class="button add-words-button">
                            <img src="{% static 'english/img/action_icons/plus.svg' %}" alt="plus">
                            Додати слова
                        </button>
                    </div>
                </div>
            </section>
        </template>

        <template id="wordRowTemplate">
            <li class="words-list-item">
                <button type="button" class="word-row">
                    <span class="word-text"></span>
                    <span class="word-progress">
                        <span class="word-progress-dot"></span>
                        <span class="word-progress-dot"></span>
                        <span class="word-progress-dot"></span>
                        <span class="word-progress-dot"></span>
                        <span class="word-progress-dot"></span>
                        <span class="word-progress-dot"></span>
                    </span>
                    <span class="word-translation"></span>
                </button>
            </li>
        </template>

        <div class="upload-csv-confirm-delete">
            <p class="upload-csv-confirm-text">
                Усі слова, переклади та зображення цього завдання буде видалено.
                Цю дію не можна скасувати.
            </p>
        </div>

        <div class="upload-csv-word-form" id="uploadCsvWordForm">
            <div class="upload-csv-field">
                <label class="upload-csv-field-label" for="wordInput">Слово</label>
                <input type="text" class="upload-csv-field-input" id="wordInput" placeholder="Введіть слово">
            </div>

            <div class="upload-csv-field">
                <label class="upload-csv-field-label" for="translationInput">Переклад</label>
                <input type="text" class="upload-csv-field-input" id="translationInput" placeholder="Введіть переклад">
            </div>

            <div class="upload-csv-images">
                <div class="upload-csv-image" data-order="0">
                    <button type="button" class="upload-csv-image-box">
                        <img class="upload-csv-image-preview" src="" alt="Зображення 1">
                    </button>
                    <button type="button" class="upload-csv-image-delete">
                        <img src="{% static 'english/img/action_icons/trash-2.svg' %}" alt="trash-2">
                    </button>
                    <input type="file" class="upload-csv-image-input" accept=".png,.jpg,.jpeg,image/png,image/jpeg" hidden>
                </div>

                <div class="upload-csv-image" data-order="1">
                    <button type="button" class="upload-csv-image-box">
                        <img class="upload-csv-image-preview" src="" alt="Зображення 2">
                    </button>
                    <button type="button" class="upload-csv-image-delete">
                        <img src="{% static 'english/img/action_icons/trash-2.svg' %}" alt="trash-2">
                    </button>
                    <input type="file" class="upload-csv-image-input" accept=".png,.jpg,.jpeg,image/png,image/jpeg" hidden>
                </div>
            </div>
        </div>

        <div class="upload-csv-actions upload-csv-file-actions">
            <button type="button" class="button upload-csv-cancel" id="cancelUploadCsvButton">
                Скасувати
            </button>
            <button type="button" class="button upload-csv-confirm" id="confirmUploadCsvButton" disabled>
                Продовжити
            </button>
        </div>

        <div class="upload-csv-actions upload-csv-list-actions">
            <button type="button" class="button upload-csv-cancel" id="deleteWordsListButton">
                <img src="{% static 'english/img/action_icons/trash-2.svg' %}" alt="trash-2">
                Видалити список
            </button>
            <button type="button" class="button upload-csv-confirm" id="closeWordsListButton">
                Закрити
            </button>
        </div>

        <div class="upload-csv-actions upload-csv-delete-actions">
            <button type="button" class="button upload-csv-cancel" id="cancelDeleteListButton">
                Скасувати
            </button>
            <button type="button" class="button upload-csv-confirm" id="confirmDeleteListButton">
                Видалити
            </button>
        </div>

        <div class="upload-csv-actions upload-csv-word-actions">
            <button type="button" class="button upload-csv-cancel" id="cancelWordButton">
                Скасувати
            </button>
            <button type="button" class="button upload-csv-confirm" id="saveWordButton">
                Зберегти
            </button>
        </div>
    </div>
</div>
