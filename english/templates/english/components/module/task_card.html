{% load static %}
<div 
class="task-card"
data-task-id="{{ task.id }}"
data-lesson-id="{{ lesson_and_tasks.lesson.id }}"
>
    <a 
    class="task-card-link"
    {% if not is_staff and task.id not in opened_task_ids %}
        disabled="true"
    {% else %}
        href="{{ task.get_absolute_url }}"
    {% endif %}
    ></a>

    <div class="task-folder">
        {% if not is_staff and task.id not in opened_task_ids %}
            <img class="task-folder-img" src="{% static 'english/img/tasks/folders/grayFolder.svg' %}" alt="folder">
        {% else %}
            <img class="task-folder-img" src="{% static 'english/img/tasks/folders/standardFolder.svg' %}" alt="folder">
        {% endif %}

        {% if not is_staff and task.id not in opened_task_ids %}
            <img class="task-folder-icon" src="{% static 'english/img/tasks/icons/lock.svg' %}" alt="lock">
        {% else %}
            <img class="task-folder-icon" src="{% static 'english/img/tasks/icons/'|add:task.icon|add:'.svg' %}" alt="{{ task.icon }}">
        {% endif %}
    </div>

    <div class="task-pill">
        <span class="task-pill-name">{{ task.name }}</span>
        {% if can_edit %}
            <input 
                type="text" 
                maxlength="100"
                class="task-name-input" 
                value="{{ task.name }}" 
                task-id="{{ task.id }}"
            >
        {% endif %}
        <span class="task-pill-percent">0%</span>
    </div>

    {% if can_edit %}
        <button type="button" class="button task-delete-button">
            <img src="{% static 'english/img/action_icons/trash-2.svg' %}" alt="trash-2">
        </button>
    {% endif %}
</div>
